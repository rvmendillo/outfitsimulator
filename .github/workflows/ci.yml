name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  core-linux:
    name: OutfitCore tests (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        run: swift test --package-path Packages/OutfitKit

  model:
    name: Clothing parser (convert + validate)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Restore converted model
        id: cache
        uses: actions/cache@v4
        with:
          path: Models/build/ClothingParserModel.mlpackage
          key: clothing-parser-${{ hashFiles('Models/convert_clothing_parser.py', 'Models/requirements.txt') }}
      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"
      - name: Convert and validate against PyTorch
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Models/requirements.txt
          python Models/convert_clothing_parser.py \
            --output Models/build/ClothingParserModel.mlpackage \
            --validate-image Packages/OutfitKit/Tests/OutfitKitTests/Fixtures/outfit_front.jpg \
            --validate-image Packages/OutfitKit/Tests/OutfitKitTests/Fixtures/outfit_side.jpg \
            --validate-image Packages/OutfitKit/Tests/OutfitKitTests/Fixtures/face_portrait.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: clothing-parser-model
          path: Models/build/ClothingParserModel.mlpackage
          if-no-files-found: error

  package-tests:
    name: OutfitKit tests (macOS, Vision + Core ML)
    needs: model
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: clothing-parser-model
          path: Models/build/ClothingParserModel.mlpackage
      - name: swift test
        env:
          REQUIRE_PARSER_MODEL: "1"
          OUTFIT_ARTIFACTS_DIR: ${{ runner.temp }}/package-previews
        run: |
          status=0
          swift test --package-path Packages/OutfitKit > "$RUNNER_TEMP/swift-test.log" 2>&1 || status=$?
          grep -E "error:|DIAG|Executed|failed \(" "$RUNNER_TEMP/swift-test.log" || true
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-previews
          path: |
            ${{ runner.temp }}/package-previews
            ${{ runner.temp }}/swift-test.log
          if-no-files-found: ignore

  package-tests-ios:
    name: OutfitKit tests (iOS Simulator)
    needs: model
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: clothing-parser-model
          path: Models/build/ClothingParserModel.mlpackage
      - name: xcodebuild test (package)
        working-directory: Packages/OutfitKit
        env:
          TEST_RUNNER_REQUIRE_PARSER_MODEL: "1"
          TEST_RUNNER_OUTFIT_ARTIFACTS_DIR: ${{ runner.temp }}/ios-previews
        run: |
          xcodebuild -list
          status=0
          xcodebuild test -scheme OutfitKit-Package \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            SWIFT_OPTIMIZATION_LEVEL=-O > "$RUNNER_TEMP/ios-test.log" 2>&1 || status=$?
          grep -E "error:|DIAG|Executed|failed \(|\*\* TEST" "$RUNNER_TEMP/ios-test.log" || true
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-package-previews
          path: |
            ${{ runner.temp }}/ios-previews
            ${{ runner.temp }}/ios-test.log
          if-no-files-found: ignore

  app:
    name: App (UI tests on simulator + IPA)
    needs: model
    runs-on: macos-26
    env:
      HAS_SIGNING: ${{ secrets.IOS_CERTIFICATE_P12 != '' && secrets.IOS_PROVISIONING_PROFILE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: clothing-parser-model
          path: Models/build/ClothingParserModel.mlpackage
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: UI tests (iPhone 17 Pro simulator)
        run: |
          mkdir -p build
          # Optimised code even in Debug so on-device-style image processing is fast;
          # Debug keeps the bundled sample photos the UI test imports.
          status=0
          xcodebuild test \
            -project OutfitSimulator.xcodeproj -scheme OutfitSimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -resultBundlePath build/UITests.xcresult \
            SWIFT_OPTIMIZATION_LEVEL=-O CODE_SIGNING_ALLOWED=NO \
            > build/uitests.log 2>&1 || status=$?
          grep -E "error:|warning: .*(deprecated|never)|Test Case|Executed|\*\* TEST" build/uitests.log || true
          exit $status
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p build/screenshots
          xcrun xcresulttool export attachments --path build/UITests.xcresult --output-path build/screenshots || true
          ls -la build/screenshots || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-screenshots
          path: |
            build/screenshots
            build/uitests.log
          if-no-files-found: ignore
      - name: Archive (Release, unsigned)
        run: |
          status=0
          xcodebuild archive \
            -project OutfitSimulator.xcodeproj -scheme OutfitSimulator -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/OutfitSimulator.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > build/archive.log 2>&1 || status=$?
          grep -E "error:|\*\* ARCHIVE" build/archive.log || true
          exit $status
      - name: Package unsigned IPA
        run: scripts/package-unsigned-ipa.sh build/OutfitSimulator.xcarchive build/OutfitSim-unsigned.ipa
      - name: Signed IPA (only when signing secrets are configured)
        if: env.HAS_SIGNING == 'true'
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD }}
        run: scripts/build-signed-ipa.sh build/OutfitSim-signed.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: OutfitSim-ipa
          path: build/OutfitSim-*.ipa
          if-no-files-found: error
