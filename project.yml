name: OutfitSimulator

options:
  bundleIdPrefix: app.outfitsim
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  OutfitKit:
    path: Packages/OutfitKit

targets:
  OutfitSimulator:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "**/.DS_Store"
      # Generated by Models/convert_clothing_parser.py (see README). Xcode
      # compiles it into ClothingParserModel.mlmodelc inside the app bundle.
      - path: Models/build/ClothingParserModel.mlpackage
        type: file
        buildPhase: sources
        optional: true
    dependencies:
      - package: OutfitKit
        product: OutfitKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: OutfitSim
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        NSCameraUsageDescription: OutfitSim uses the camera to photograph your clothes and your face. Photos stay on your device.
        NSPhotoLibraryAddUsageDescription: OutfitSim saves outfit images you export to your photo library.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.outfitsim.OutfitSimulator
        PRODUCT_NAME: OutfitSimulator
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COREML_CODEGEN_LANGUAGE: None
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: minimal
      configs:
        Release:
          # UI-test sample photos are bundled in Debug builds only.
          EXCLUDED_SOURCE_FILE_NAMES: "uitest-sample-*"
          SWIFT_COMPILATION_MODE: wholemodule

  OutfitSimulatorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: OutfitSimulator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.outfitsim.OutfitSimulatorUITests
        TEST_TARGET_NAME: OutfitSimulator
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: minimal

schemes:
  OutfitSimulator:
    build:
      targets:
        OutfitSimulator: all
        OutfitSimulatorUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OutfitSimulatorUITests
    archive:
      config: Release
